name: RetailPulse CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ------------------------------------------------------------
  # 1. Lint — catch style and syntax problems early
  # ------------------------------------------------------------
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linters
        run: pip install ruff

      - name: Ruff check
        run: ruff check src dashboard --output-format=github

      - name: Ruff format check
        run: ruff format --check src dashboard

      - name: Compile every module
        run: python -m compileall -q src dashboard

  # ------------------------------------------------------------
  # 2. Test — installer and unit tests
  # ------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scikit-learn pyarrow pytest

      - name: Run unit tests
        run: pytest tests -v --tb=short

      - name: Run unit tests without pytest (fallback runner)
        run: python tests/run_tests.py

  # ------------------------------------------------------------
  # 3. Build — prove the Docker image actually builds
  # ------------------------------------------------------------
  build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: retailpulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
